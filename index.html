function tpList(m){const t=(db.tp[C().kelas]||{})[m];if(t&&t.length)return t;if(C().kelas==1&&K1[m])return K1[m];const f=FT[fase(+C().kelas)],k=mk(m);if(k=='hindu')return HT[C().kelas]||[];return k=='seni'?f.rupa.slice(0,1).concat(f.musik.slice(1)):(f[k]||[])}
function autoFill(m,n){const l=tpList(m),k=C().kktp||75,sc=[];l.forEach((t,j)=>{const x=parseFloat((n.t||[])[j]);if(!isNaN(x))sc.push([t,x])});if(!sc.length)return;if(!n.ov)n.v=Math.round(sc.reduce((a,b)=>a+b[1],0)/sc.length);if(!n.man){n.a=sc.filter(x=>x[1]>=k).map(x=>x[0]).join('; ');n.b=sc.filter(x=>x[1]<k).map(x=>x[0]).join('; ')}}

function tpRows(m,n,i){const l=tpList(m);if(!l.length)return `<p class="hint">Belum ada TP untuk mapel ini. Isi di tab Data Sekolah & Kelas agar capaian terisi otomatis, atau isi manual di bawah.</p>`;return `<div style="margin-bottom:8px">${l.map((t,j)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><input type="number" min="0" max="100" style="width:72px" value="${esc((n.t||[])[j])}" onchange="setT(${i},${j},this.value)"><span style="font-size:13px">${esc(t)}</span></div>`).join('')}<button class="btn s" onclick="resetAuto(${i})">Hitung ulang otomatis</button></div>`}
function tpCard(){const k=C().kelas;return `<div class="card"><h2>Tujuan pembelajaran (TP) kelas ${k}</h2><p class="hint">Satu TP per baris, ditulis sebagai kelanjutan kalimat “Menunjukkan penguasaan dalam …”. Salin dari ATP Anda. TP sudah terisi bawaan (disusun dari CP tiap fase dan contoh rapor Anda). Cocokkan dengan ATP sekolah, ubah bila perlu, lalu tekan Simpan TP.</p><div class="row" style="margin:0 0 10px"><div><label>Mapel agama di kelas ini</label><select onchange="setAgama(this.value)">${sel2(['Islam','Hindu'],mapelList().some(m=>mk(m)=='hindu')?'Hindu':'Islam')}</select></div></div><div style="max-width:200px"><label>KKTP (batas tuntas)</label><input type="number" value="${C().kktp||75}" onchange="C().kktp=+this.value||75;save()"></div>${mapelList().map(m=>`<div style="margin-top:10px"><label>${esc(m.replace('|',': '))}</label><textarea class="tpt" data-m="${esc(m)}">${esc(tpList(m).join('\n'))}</textarea></div>`).join('')}<div class="row"><button class="btn" onclick="saveTP()">Simpan TP</button></div></div><div class="card"><h2>Impor TP dari file</h2><p class="hint">Siapkan file Excel (.xlsx, .xls) atau CSV dengan tiga kolom: Kelas, Mata Pelajaran, TP. Satu TP per baris, atau beberapa TP dalam satu sel dipisah baris baru. Kolom Kelas boleh kosong (dipakai kelas yang sedang dipilih). TP untuk mapel yang sama menggantikan TP yang ada, dan mapel yang belum ada ditambahkan. Impor langsung tersimpan.</p><div class="row"><div><label>File TP</label><input type="file" accept=".xlsx,.xls,.csv" onchange="readX(this,impTP)"></div></div><details style="margin-top:12px"><summary class="hint" style="cursor:pointer">Opsi lain: tempel dari Excel dan judul kolom template</summary><p class="hint" style="margin-top:10px">Tempel dari Excel, termasuk baris judul:</p><textarea id="imptp" style="min-height:100px"></textarea><div class="row"><button class="btn" onclick="impTPPaste()">Impor dari tempelan</button></div><p class="hint" style="margin-top:12px">Judul kolom template, function readX(i,cb){const f=i.files[0];if(!f)return;if(typeof XLSX=='undefined'){alert('Pustaka Excel belum termuat. Gunakan tempel data.');return}const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}))}catch(e){alert('File tidak dapat dibaca.')}};r.readAsArrayBuffer(f)}

function impTP(rows){if(rows.length<2){alert('Data kosong.');return}const nz=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,''),hn=rows[0].map(nz),ik=hn.indexOf('kelas'),im=hn.findIndex(x=>x.startsWith('matapelajaran')||x=='mapel'||x=='mapelajaran'),it=hn.findIndex(x=>x=='tp'||x=='atp'||x.startsWith('tujuan'));if(im<0||it<0){alert('Kolom Mata Pelajaran dan TP tidak ditemukan. Baris pertama harus berisi judul kolom.');return}const acc={};let n=0,nw=0;
rows.slice(1).forEach(r=>{const mp=String(r[im]||'').trim();if(!mp)return;const km=ik>=0?String(r[ik]).match(/[1-6]/):null,kl=km?+km[0]:+C().kelas,tps=String(r[it]||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!tps.length)return;const list=db.mapel[kl]||defMapel(kl);let m=list.find(x=>nz(x)==nz(mp)||nz(x.split('|').pop())==nz(mp)||nz(x.replace('|',''))==nz(mp));if(!m)m=list.find(x=>mk(x)&&mk(x)==mk(mp));if(!m){m=mp;db.mapel[kl]=list.concat([mp]);nw++}const a=acc[kl]=acc[kl]||{};(a[m]=a[m]||[]).push(...tps);n+=tps.length});
Object.keys(acc).forEach(k=>{db.tp[k]=Object.assign(db.tp[k]||{},acc[k])});save();alert(n+' TP diimpor.'+(nw?' '+nw+' mapel baru ditambahkan.':''));draw()}

"width:90px" placeholder="otomatis" value="${C().pa==null?'':C().pa}" onchange="C().pa=this.value===''?null:+this.value;save();draw()"></div><div><label>Jarak footer dari bawah (mm)</label><input type="number" min="0" max="60" style="width:90px" placeholder="otomatis" value="${C().fb==null?'':C().fb}" onchange="C().fb=this.value===''?null:+this.value;save();draw()"></div><div><label>Ruang aman bawah (mm)</label><input type="number" min="0" max="60" style="width:90px" value="${C().safe==null?15:C().safe}" onchange="C().safe=+this.value;save();draw()"></div><div><label>Jarak baris</label><select onchange="C().jarak=this.value;save();draw()">${sel2(['Rapat','Normal','Longgar'],C().jarak||'Rapat')}</select></div><div><label>Halaman identitas di depan rapor</label><select onchange="C().withId=this.value=='Ya';save();draw()">${sel2(['Tidak','Ya'],C().withId?'Ya':'Tidak')}</select></div><button class="btn" onclick="window.print()">Cetak rapor ini</button><button class="btn s" onclick="allP=true;draw();setTimeout(()=>{window.print();allP=false;draw()},300)">Cetak semua siswa kelas ini</button><button class="btn s" onclick="unduhPDF(this,false)">Unduh PDF (rapor ini)</button><button class="btn s" onclick="unduhPDF(this,true)">Unduh PDF (semua siswa)</button><button class="btn s" onclick="unduhWord(false)">Unduh Word (rapor ini)</button><button class="btn s" onclick="unduhWord(true)">Unduh Word (semua siswa)</button></div><p class="hint">Ukuran kertas: A4 = 210 x 297 mm, F4 = 210 x 330 mm (di sebagian printer disebut Folio, 8,5 x 13 in). Kalau hasil cetak terpotong, penyebab paling sering adalah ukuran kertas di dialog cetak berbeda dengan pilihan di sini (misalnya aplikasi F4 tetapi dialog A4). Pilih ukuran yang sama; bila F4 tidak ada di daftar, pilih Legal atau Folio. Atur Margins = None, Scale = 100, dan matikan Headers and footers. Alternatifnya, tombol Unduh PDF membuat PDF dengan ukuran kertas yang pas; cetak PDF itu dengan Scale = 100% atau Actual size. Margin bawah j function nilaiExport(){const m=mapelList()[mi],tp=tpList(m),ss=kelasSiswa();if(!ss.length){alert('Belum ada siswa di kelas ini.');return}
const rows=[['No','Nama','NISN'].concat(tp.map((t,j)=>'TP '+(j+1)),['SAS'])].concat(ss.map((s,r)=>{const n=D(s).n[m]||{};return [r+1,s.nama,s.nisn||''].concat(tp.map((t,j)=>(n.t||[])[j]==null?'':(n.t||[])[j]),[n.s==null?'':n.s])}));

else{const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),b=new Blob(['\ufeff'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}catch(e){alert('Export gagal.')}}
function nilaiImport(rows){const m=mapelList()[mi],tp=tpList(m),nz=x=>String(x).toLowerCase().replace(/[^a-z0-9]/g,'');
let hi=rows.findIndex(r=>r.some(c=>nz(c)=='nama'));if(hi<0){alert('Kolom Nama tidak ditemukan. Gunakan file hasil Export (baris pertama berisi judul kolom).');return}
const h=rows[hi].map(nz),iN=h.indexOf('nama'),iJ=h.indexOf('nisn'),iS=h.indexOf('sas'),cols=[];
h.forEach((x,c)=>{const k=x.match(/^tp(\d+)$/);if(k&&+k[1]>=1&&+k[1]<=tp.length)cols.push([c,+k[1]-1])});
if(!cols.length&&iS<0){alert('Kolom TP 1, TP 2, ... atau SAS tidak ditemukan.');return}
const ss=kelasSiswa(),byN={},byJ={};ss.forEach(s=>{byN[nz(s.nama)]=s;if(s.nisn)byJ[nz(s.nisn)]=s});
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)||x<0||x>100?null:x};
let ok=0,cells=0;const miss=[];
rows.slice(hi+1).forEach(r=>{const nm=r[iN];if(nm==null||String(nm).trim()==='')return;const s=(iJ>=0&&r[iJ]&&byJ[nz(r[iJ])])||byN[nz(nm)];if(!s){miss.push(String(nm).trim());return}
const n=D(s).n[m]=D(s).n[m]||{};let ch=0;cols.forEach(([c,j])=>{const x=num(r[c]);if(x!=null){n.t=n.t||[];n.t[j]=x;ch++}});if(iS>=0){const x=num(r[iS]);if(x!=null){n.s=x;ch++}}
if(ch){autoFill(m,n);ok++;cells+=ch}});
save();draw();alert('Import selesai untuk '+m.replace('|',': ')+'.\n'+ok+' siswa diperbarui ('+cells+' nilai).'+(miss.length?'\nNama tidak cocok dengan data siswa ('+miss.length+'): '+miss.slice(0,10).join(', ')+(miss.length>10?', ...':''):'')+'\nSel kosong di file tidak menghapus nilai yang sudah ada.')}

const sect=i=>`<w:sectPr><w:footerReference w:type="default" r:id="rIdF${i}"/><w:pgSz w:w="${W}" w:h="${H}"/><w:pgMar w:top="${mT}" w:right="${mR}" w:bottom="${mB}" w:left="${mL}" w:header="0" w:footer="${fb}" w:gutter="0"/></w:sectPr>`;
let body='';pages.forEach((p,i)=>{body+=pageBody(p);if(i<pages.length-1)body+=`<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr>${sect(i)}</w:pPr></w:p>`;else body+=`<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/><w:rPr><w:sz w:val="2"/></w:rPr></w:pPr></w:p>`});
const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}${sect(pages.length-1)}</w:body></w:document>`;
const files=[{name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>${pages.map((p,i)=>`<Override PartName="/word/footer${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>`).join('')}</Types>`},
{name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
{name:'word/_rels/document.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${pages.map((p,i)=>`<Relationship Id="rIdF${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer${i}.xml"/>`).join('')}</Relationships>`},
{name:'word/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>${fnt}<w:sz w:val="${SZ}"/><w:szCs w:val="${SZ}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="${LN}" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`},
{name:'word/document.xml',data:doc},...pages.map((p,i)=>({name:`word/footer${i}.xml`,data:footerXml(p)}))];
return zipStore(files)}
window.unduhWord=async function(all){
const btns=[...document.querySelectorAll('button')].filter(b=>/Unduh Word/.test(b.textContent));btns.forEach(b=>b.disabled=true);
try{if(all){allP=true;draw()}await new Promise(r=>setTimeout(r,200));
const pages=[...document.querySelectorAll('.page')].filter(p=>/\bp[123]\b/.test(p.className));
if(!pages.length){alert('Tidak ada halaman rapor untuk diunduh.');return}
const blob=build(pages),sl=curSis(),a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='rapor-kelas'+C().kelas+(all||!sl?'':'-'+String(sl.nama).replace(/[^A-Za-z0-9]+/g,'_'))+'.docx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
catch(e){console.error(e);alert('Gagal membuat file Word. Coba lagi, atau gunakan Unduh PDF.')}
finally{if(all){allP=false;draw()}btns.forEach(b=>b.disabled=false)}};
window.__buildWord=build;
})();

<style id="pas-css">
/* ===== Modul Cetak F4 Pas ===== */

.pasbox h2{margin:0 0 6px;font:700 17px Georgia,serif;color:var(--ac)}
.pasbox ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--mu);line-height:1.55}
#pasmsg{margin:10px 0 0;font-size:13px;min-height:18px;color:var(--ac);font-weight:600}
body.guide .page::before{content:"";position:absolute;left:var(--ml);right:var(--mr);top:var(--mt);bottom:var(--mb);border:1px dashed #d33;pointer-events:none}
body.guide .page::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--mb) + var(--safe,15mm));border-top:1px dashed #27c;pointer-events:none}

html,body{margin:0!important;padding:0!important;height:auto!important;overflow:visible!important;background:#fff!important}
.wrap,main#app,.scroll{display:block!important;margin:0!important;padding:0!important;width:auto!important;max-width:none!important;overflow:visible!important;border:0!important;box-shadow:none!important;background:none!important}
.page{height:calc(var(--ph,330mm) - 1.2mm)!important;min-height:0!important;overflow:hidden!important;margin:0!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page::before,.page::after{display:none!important}
.scroll>.page:last-child{break-after:auto;page-break-after:auto}
.bt th{background:#e8e8e8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bt tr{break-inside:avoid;page-break-inside:avoid}
body.kal>*:not(#kal):not(script):not(style){display:none!important}

}

<script>
(function(){
const mmv=v=>Math.round(v*10)/10;
function pasFit(){const w=$('#fitwarn');return !document.querySelector('.page.p3')&&!(w&&w.textContent)}
function say(t){const m=$('#pasmsg');if(m)m.textContent=t}
window.pasAuto=function(){
 const c=C(),cur=+c.fs||10,was=allP;
 c.paper='F4';c.ppA='';c.pa=c.pa;allP=true;
 const fss=[12,11,10,9,8].filter(x=>x<=cur),js=['Longgar','Normal','Rapat'];
 let ok=null;
 outer:for(const f of fss)for(const j of js){c.fs=f;c.jarak=j;draw();if(pasFit()){ok=[f,j];break}}
 if(!ok){c.fs=8;c.jarak='Rapat'}
 allP=was;save();draw();
 say(ok?`Sudah pas: kertas F4, huruf ${ok[0]} pt, jarak baris ${ok[1]}. Semua siswa muat dalam 2 halaman.`:'Isi rapor terlalu panjang untuk 2 halaman walau huruf 8 pt dan jarak Rapat. Kecilkan margin atau ruang aman bawah, atau singkat TP.');
};
window.pasCetak=function(){
 const c=C();let ch=false;if(c.paper!='F4'){c.paper='F4';ch=true}
 if(ch){save();draw()}
 setTimeout(()=>window.print(),150);
};
window.pasGuide=function(on){C().guide=!!on;save();document.body.classList.toggle('guide',!!on)};
window.pasPA=function(){
 const v=parseFloat(($('#pasv')||{}).value);
 if(isNaN(v)||v>=330){C().pa=null;save();draw();say('Area cetak penuh (330 mm). Tidak ada penggeseran.');return}
 if(v<150){say('Angka terlalu kecil. Isi angka mm terakhir yang tercetak utuh, misalnya 297.');return}
 C().pa=v;save();draw();say(`Tinggi area cetak printer diatur ${v} mm. Cetak ulang dan periksa jarak atas dan bawah.`);
};
window.pasUji=function(){
 const c=C(),oldPa=c.pa,oldP=c.paper;c.paper='F4';c.pa=null;applyPaper();
 let h='';
 for(let y=0;y<=330;y+=5){const L=y%10==0?7:3.5;
  h+=`<i class="t" style="left:0;top:${y}mm;width:${L}mm;height:.2mm"></i><i class="t" style="right:0;top:${y}mm;width:${L}mm;height:.2mm"></i>`;
  if(y%10==0&&y>0&&y<330)h+=`<i style="left:8mm;top:${y-1.2}mm">${y}</i><i style="right:8mm;top:${y-1.2}mm">${y}</i>`}
 for(let x=0;x<=210;x+=5){const L=x%10==0?7:3.5;
  h+=`<i class="t" style="top:0;left:${x}mm;height:${L}mm;width:.2mm"></i><i class="t" style="bottom:0;left:${x}mm;height:${L}mm;width:.2mm"></i>`;
  if(x%10==0&&x>0&&x<210)h+=`<i style="top:8mm;left:${x-1.5}mm">${x}</i><i style="bottom:8mm;left:${x-1.5}mm">${x}</i>`}
 h+=`<i style="left:30mm;right:30mm;top:60mm;font-size:11pt;line-height:1.5"><b>LEMBAR UJI KERTAS F4 (210 x 330 mm)</b><br>1. Pastikan ukuran kertas di dialog cetak F4 / Folio / Legal, Skala 100%, Margin None, Header dan footer mati.<br>2. Ukur garis di bawah dengan penggaris. Harus tepat 100 mm. Jika tidak, skala cetak bukan 100%.<br>3. Lihat angka paling bawah di tepi kiri atau kanan yang tercetak utuh, lalu isikan di aplikasi (kolom Angka mm terakhir).<br>4. Jika angka di tepi kiri atau kanan terpotong, tambah margin kiri dan kanan.</i>
 <i class="t" style="left:55mm;top:130mm;width:100mm;height:.6mm"></i><i style="left:55mm;top:132mm">|&lt;-- 100 mm --&gt;|</i>
 <i style="left:0;top:0;width:210mm;height:330mm;border:.3mm solid #000"></i>`;
 let k=$('#kal');if(!k){k=document.createElement('div');k.id='kal';document.body.appendChild(k)}
 k.innerHTML=h;document.body.classList.add('kal');
 const done=()=>{document.body.classList.remove('kal');c.paper=oldP;c.pa=oldPa;applyPaper();window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);
 setTimeout(()=>window.print(),150);
};
const _c=V.cetak;
V.cetak=function(){
 const out=_c.call(V),r=document.documentElement.style;
 r.setProperty('--safe',(C().safe==null?15:+C().safe)+'mm');
 document.body.classList.toggle('guide',!!C().guide);
 const p=`<div class="pasbox noprint"><h2>Cetak F4 pas</h2><p class="hint" style="margin:0">Tiga langkah supaya hasil cetak sama dengan tampilan di layar.</p>
 <div class="row"><button class="btn" onclick="pasAuto()">1. Pas-kan otomatis ke F4</button><button class="btn s" onclick="pasUji()">2. Cetak lembar uji F4</button><div><label>Angka mm terakhir yang tercetak utuh</label><input id="pasv" type="number" min="150" max="330" style="width:110px" placeholder="mis. 297" value="${C().pa==null?'':C().pa}"></div><button class="btn s" onclick="pasPA()">Terapkan</button><button class="btn" onclick="pasCetak()">3. Cetak F4 sekarang</button><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" ${C().guide?'checked':''} onchange="pasGuide(this.checked)"> Garis bantu margin (merah) dan ruang aman (biru)</label></div>
 <p id="pasmsg"></p>
 <ol><li>Langkah 1 memilih huruf dan jarak baris terbesar yang masih muat dalam 2 halaman untuk semua siswa, tanpa menambah ukuran huruf di atas pilihan Anda.</li><li>Langkah 2 mencetak penggaris. Jika bagian bawah kertas tidak ikut tercetak, isi angka terakhir yang terbaca lalu tekan Terapkan.</li><li>Di dialog cetak: kertas F4, Folio, atau Legal, Margin None, Skala 100%, Header dan footer mati, Background graphics hidup.</li></ol></div>`;
 return out.includes('<div class="scroll">')?out.replace('<div class="scroll">',p+'<div class="scroll">'):out+p;
};
})();
</script>
