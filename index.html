Object.keys(acc).forEach(k=>{db.tp[k]=Object.assign(db.tp[k]||{},acc[k])});save();alert(n+' TP diimpor.'+(nw?' '+nw+' mapel baru ditambahkan.':''));draw()}

function doBackup(){try{const b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a'),d=new Date(),z=n=>String(n).padStart(2,'0');a.href=URL.createObjectURL(b);a.download='backup-rapor-sd-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('Backup gagal.')}}
function doRestore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!='object'||!o.sk||!o.cfg)throw 0;if(!confirm('Data yang ada sekarang akan diganti dengan isi file backup. Lanjutkan?')){inp.value='';return}db=Object.assign(def(),o);save();alert('Data dipulihkan.');draw()}catch(e){alert('File backup tidak valid.');inp.value=''}};r.readAsText(f)}
async function unduhPDF(btn,all){if(!window.html2canvas||!window.jspdf){alert('Pustaka PDF belum termuat. Pastikan komputer terhubung ke internet, lalu muat ulang halaman.');return}
const f=C().paper=='F4',W=f?215:210,H=f?330:297,t0=btn.textContent;btn.disabled=true;if(all){allP=true;draw()}document.body.classList.add('exp');
try{const pg=[...document.querySelectorAll('.page')],doc=new window.jspdf.jsPDF({unit:'mm',format:[W,H],orientation:'portrait'});
for(let i=0;i<pg.length;i++){btn.textContent='Membuat PDF '+(i+1)+'/'+pg.length+'...';await new Promise(r=>setTimeout(r,0));const cv=await html2canvas(pg[i],{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:-window.scrollY});if(i)doc.addPage([W,H],'portrait');doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,Math.min(H,W*cv.height/cv.width))}
const sl=curSis();doc.save('rapor-kelas'+C().kelas+(all||!sl?'':'-'+String(sl.nama).replace(/[^A-Za-z0-9]+/g,'_'))+'.pdf')}
catch(e){alert('Gagal membuat PDF. Coba lagi, atau gunakan tombol Cetak.')}
document.body.classList.remove('exp');btn.disabled=false;btn.textContent=t0;if(all){allP=false;draw()}}
function fitPages(){const W=$('#fitwarn');if(W)W.textContent='';const pr=document.createElement('div');pr.style.cssText='position:absolute;visibility:hidden;width:1px;height:var(--ph,297mm)';const p0=document.createElement('div');p0.style.cssText='position:absolute;visibility:hidden;width:1px;height:100mm';document.body.append(pr,p0);const H=pr.offsetHeight,k=p0.offsetHeight/100;pr.remove();p0.remove();
const mB=C().mB==null?18:+C().mB,sf=C().safe==null?15:+C().safe,lim=H-(mB+sf)*k;let warn=false;
const bot=(el,pg)=>el.getBoundingClientRect().bottom-pg.getBoundingClientRect().top;
document.querySelectorAll('.page.p1').forEach(p1=>{const p2=p1.nextElementSibling;if(!p2)return;const m=p2.querySelector('.p2m'),tb1=p1.querySelector('table.bt').tBodies[0],tb2=m.querySelector('table').tBodies[0];
while(tb1.rows.length>2&&bot(tb1.rows[tb1.rows.length-1],p1)>lim){const tr=tb1.rows[tb1.rows.length-1],r1=tb2.rows[1];r1?tb2.insertBefore(tr,r1):tb2.appendChild(tr);m.style.display=''}
const kids=()=>[...p2.children].filter(e=>!e.classList.contains('ft'));let p3=null,ref=null;
for(let g=0;g<40;g++){const ks=kids(),last=ks[ks.length-1];if(bot(last,p2)<=lim)break;if(ks.indexOf(m)>=ks.length-1){warn=true;break}
if(!p3){p3=p2.cloneNode(false);p3.classList.remove('p2');p3.classList.add('p3');[...p2.children].slice(0,2).forEach(e=>p3.appendChild(e.cloneNode(true)));const f=p2.querySelector('.ft').cloneNode(true);f.lastElementChild.textContent='Halaman : 3';p3.appendChild(f);p2.after(p3);ref=f}
p3.insertBefore(last,ref);ref=last}
if(p3){const c=p3.children[2];if(c&&c.classList.contains('gap'))c.remove();const l3=[...p3.children].filter(e=>!e.classList.contains('ft')).pop();if(bot(l3,p3)>lim)warn=true}});
if(W&&warn)W.textContent='Isi rapor sangat panjang dan masih melewati batas halaman. Pilih jarak Rapat, kecilkan margin, atau kecilkan ruang aman bawah.'}
function draw(){if(tab!='siswa')editId=null;applyPaper();nav();$('#app').innerHTML=V[tab]();if(tab=='cetak')fitPages();window.scrollTo(0,0)}
draw();
